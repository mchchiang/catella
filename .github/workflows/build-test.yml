name: Build and test

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.13"
          activate-environment: catella
          channels: conda-forge
          miniforge-version: latest
          use-mamba: true

      - name: Install conda-only build tools
        run: >
          mamba install -y hdf5 pybind11 cxx-compiler cmake ninja pkg-config
          "pip>=25.1"

      - name: Build and install package
        run: pip install -e . --group test -v

      - name: Run tests
        run: pytest tests/
