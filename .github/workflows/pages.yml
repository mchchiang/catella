name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.13"
          activate-environment: catella
          channels: conda-forge
          miniforge-version: latest
          use-mamba: true

      - name: Install conda-only build tools
        run: mamba install -y hdf5 pybind11 cxx-compiler cmake ninja pkg-config pandoc "pip>=25.1"

      - name: Build and install package with doc extras
        run: pip install -e . --group doc -v

      - name: Build Sphinx docs
        run: sphinx-build -b html docs/source public

      - name: Upload docs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: public

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
