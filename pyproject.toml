[build-system]
requires = ["scikit-build-core>=0.9", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "catella"
dynamic = ["version"]
description = "A Monte-Carlo simulator for predicting nucleosome positions based on DNA methylation footprinting data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [
    { name = "Michael Chiang", email = "michael.chiang@ed.ac.uk" },
]
maintainers = [
    { name = "Davide Marenduzzo" },
    { name = "Nick Gilbert" },
]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "pandas>=3.0",
    "h5py",
    "scipy",
    "typer<=0.25.1",
    "rich",
    "matplotlib",
    "pyfaidx",
    "pyarrow",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/mchchiang/catella"

[project.scripts]
catella = "catella.cli:app"

[dependency-groups]
dev = ["ruff"]
test = ["pytest"]
doc = [
    "numpy",
    "pandas>=3.0",
    "typer<=0.25.1",
    "jupyterlab",
    "ipywidgets",
    "nbsphinx",
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-click",
    "myst-parser",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["src/catella"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/catella/__about__.py"
regex = "__version__ = ['\"](?P<value>[^'\"]+)['\"]"

[tool.hatch.envs.docs]
type = "virtual"
path = ".docs_venv"
dependency-groups = ["doc"]
dev-mode = true
scripts.build = "sphinx-build -M html docs/source docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"

[tool.hatch.envs.test]
dependency-groups = ["dev", "test"]

[tool.ruff]
line-length = 80
src = ["src/catella"]
lint.pydocstyle.convention = "numpy"
